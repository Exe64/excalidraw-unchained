services:
  excalidraw:
    # image of the latest release (`docker compose pull` to update);
    # `docker compose up -d --build` builds it from the sources instead
    image: ghcr.io/exe64/excalidraw-unchained:latest
    build:
      context: .
    container_name: excalidraw
    ports:
      - "3000:80"
    # also needed to apply a backup restore (the server restarts)
    restart: unless-stopped
    environment:
      # optional: creates the administrator account on first start. Without
      # it, the app asks to create it the first time it's opened.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # behind an HTTPS reverse proxy, trust its X-Forwarded-* headers so that
      # the session cookie gets the Secure flag
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      # public URL, used in the drawing links given to AI assistants (MCP)
      - PUBLIC_URL=${PUBLIC_URL:-}
      # AI features of the editor: anthropic (Claude) or openai (any
      # OpenAI-compatible API: OpenAI, Mistral, Ollama…). Empty = disabled.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      # single sign-on through an OpenID Connect provider (empty = disabled);
      # redirect URL to register: <PUBLIC_URL>/api/auth/sso/callback
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - OIDC_NEW_USERS=${OIDC_NEW_USERS:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      # automatic backups of the database, in /data/backups (0 = disabled)
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - excalidraw-data:/data

volumes:
  excalidraw-data:
